name: Build APK

# push to dev     -> rolling "dev" pre-release (replaced every time)
# push tag v1.2.3 -> stable release "v1.2.3" (marked Latest)
# push to main/PR -> build check only
#
# Each release carries the APK plus update.json. The app reads the release through the
# GitHub API first and falls back to update.json via the release download URL, which isn't
# subject to the API rate limit. No workflow artifacts are uploaded (saves Actions storage).

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "CHANNEL=stable" >> "$GITHUB_ENV"
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "CHANNEL=dev" >> "$GITHUB_ENV"
            echo "VERSION_NAME=1.0-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=dev" >> "$GITHUB_ENV"
          fi
          # One counter for both channels, so any newer build installs over an older one.
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set; using a throwaway debug key."
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          APK="XEU-Forums-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/*.apk "dist/$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum "dist/$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c%s "dist/$APK")" >> "$GITHUB_ENV"

      - name: Release notes and update.json
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          if [ "$CHANNEL" = dev ]; then
            CHANGES="$(git log -1 --pretty=format:'%s%n%n%b' "$GITHUB_SHA")"
          else
            CHANGES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
            [ -z "$CHANGES" ] && CHANGES="Stable release $VERSION_NAME"
          fi
          printf '%s\n' "$CHANGES" > dist/notes.md
          printf '\n<!-- versionCode: %s versionName: %s sha256: %s -->\n' "$VERSION_CODE" "$VERSION_NAME" "$SHA256" >> dist/notes.md
          jq -n \
            --arg channel "$CHANNEL" \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK" \
            --argjson apkSize "$APK_SIZE" \
            --arg sha256 "$SHA256" \
            --arg notes "$CHANGES" \
            --arg commit "$GITHUB_SHA" \
            '{channel:$channel, versionCode:$versionCode, versionName:$versionName, apkUrl:$apkUrl,
              apkSize:$apkSize, sha256:$sha256, notes:$notes, commit:$commit}' > dist/update.json
          cat dist/update.json

      - name: Publish dev release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "dist/$APK" dist/update.json \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Dev build $VERSION_NAME" \
            --notes-file dist/notes.md

      - name: Publish stable release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/$APK" dist/update.json \
            --latest \
            --title "XEU Forums $VERSION_NAME" \
            --notes-file dist/notes.md
